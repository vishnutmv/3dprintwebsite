<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found — 3D Print Co.</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("3dprintco-theme") === "dark" ? "dark" : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --page: #f8f7f3;
        --surface: #ffffff;
        --border: #eae8e1;
        --text: #29312d;
        --muted: #5b655c;
        --accent: #b04c2c;
        --accent-hover: #984326;
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --page: #0d110f;
        --surface: #161d19;
        --border: #2a352e;
        --text: #e6ece6;
        --muted: #a7b2a9;
        --accent: #e98957;
        --accent-hover: #f0a07a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--page);
        color: var(--text);
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      }
      main {
        width: min(100%, 620px);
        padding: clamp(28px, 6vw, 48px);
        border: 1px solid var(--border);
        border-radius: 32px;
        background: var(--surface);
        text-align: center;
      }
      .mark {
        display: inline-grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 16px;
        background: linear-gradient(140deg, #f3bd8f, #d86e40 58%, #e0c47e);
        color: #29312d;
        font-size: 14px;
        font-weight: 900;
      }
      .eyebrow {
        margin: 24px 0 0;
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0 0;
        font-size: clamp(30px, 6vw, 46px);
        line-height: 1;
        letter-spacing: -0.04em;
      }
      p {
        margin: 14px auto 0;
        max-width: 430px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 28px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      a.primary {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }
      a:hover { border-color: var(--accent); }
      a.primary:hover { background: var(--accent-hover); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">3D</span>
      <p class="eyebrow">404</p>
      <h1>This page never got printed.</h1>
      <p>The link is wrong, or the page moved. The catalogue is still where you left it.</p>
      <nav aria-label="404 navigation">
        <a href="/">Home</a>
        <a class="primary" href="/shop">Shop the prints</a>
      </nav>
    </main>
  </body>
</html>
